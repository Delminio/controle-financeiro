<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Organize Financeiro - Gestão Pessoal</title>
    <meta name="theme-color" content="#059669" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#ecfdf5',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
              }
            }
          }
        }
      }
    </script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const API_URL = 'https://controle-financeiro-x8ah.onrender.com/api';

      function App() {
        const [token, setToken] = useState(localStorage.getItem('token') || '');
        const [user, setUser] = useState(JSON.parse(localStorage.getItem('user') || 'null'));
        const [authMode, setAuthMode] = useState('login'); // 'login' ou 'register'
        
        // Formulário de Auth
        const [authName, setAuthName] = useState('');
        const [authEmail, setAuthEmail] = useState('');
        const [authPassword, setAuthPassword] = useState('');
        const [authError, setAuthError] = useState('');
        const [authLoading, setAuthLoading] = useState(false);

        // Dashboard e Navegação
        const [activeSection, setActiveSection] = useState('dashboard');
        const [data, setData] = useState({ summary: { totalReceitas: 0, totalDespesas: 0, saldoFinal: 0 }, transactions: [] });
        const [loadingData, setLoadingData] = useState(false);
        const [sidebarOpen, setSidebarOpen] = useState(false);

        // Modal de Lançamento
        const [showModal, setShowModal] = useState(false);
        const [description, setDescription] = useState('');
        const [amount, setAmount] = useState('');
        const [type, setType] = useState('expense');
        const [account, setAccount] = useState('Nubank');
        const [person, setPerson] = useState('Bernadete');
        const [submitting, setSubmitting] = useState(false);

        const handleAuth = async (e) => {
          e.preventDefault();
          setAuthError('');
          setAuthLoading(true);

          const endpoint = authMode === 'login' ? '/auth/login' : '/auth/register';
          const payload = authMode === 'login' 
            ? { email: authEmail, password: authPassword }
            : { name: authName, email: authEmail, password: authPassword };

          try {
            const res = await fetch(API_URL + endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const json = await res.json();
            if (!res.ok) throw new Error(json.error || 'Erro na autenticação.');

            setToken(json.token);
            setUser(json.user);
            localStorage.setItem('token', json.token);
            localStorage.setItem('user', JSON.stringify(json.user));
          } catch (err) {
            setAuthError(err.message);
          } finally {
            setAuthLoading(false);
          }
        };

        const handleLogout = () => {
          setToken('');
          setUser(null);
          localStorage.removeItem('token');
          localStorage.removeItem('user');
        };

        const fetchData = async () => {
          if (!token) return;
          setLoadingData(true);
          try {
            const res = await fetch(API_URL + '/transactions', {
              headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.status === 401 || res.status === 403) {
              handleLogout();
              return;
            }
            const json = await res.json();
            setData(json);
          } catch (err) {
            console.error(err);
          } finally {
            setLoadingData(false);
          }
        };

        useEffect(() => {
          if (token) fetchData();
        }, [token]);

        const handleAddTransaction = async (e) => {
          e.preventDefault();
          if (!description || !amount) return;

          setSubmitting(true);
          try {
            const res = await fetch(API_URL + '/transactions', {
              method: 'POST',
              headers: { 
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token 
              },
              body: JSON.stringify({ description, amount: parseFloat(amount), type, account, person })
            });

            if (res.ok) {
              setDescription('');
              setAmount('');
              setShowModal(false);
              fetchData();
            }
          } catch (err) {
            console.error(err);
          } finally {
            setSubmitting(false);
          }
        };

        const handleDeleteTransaction = async (id) => {
          if (!confirm('Deseja apagar este lançamento?')) return;
          try {
            await fetch(API_URL + '/transactions/' + id, {
              method: 'DELETE',
              headers: { 'Authorization': 'Bearer ' + token }
            });
            fetchData();
          } catch (err) {
            console.error(err);
          }
        };

        const formatMoney = (val) => {
          return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
        };

        // ECRÃ DE LOGIN / REGISTO
        if (!token) {
          return (
            <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl border border-slate-100">
                <div className="text-center mb-8">
                  <div className="w-14 h-14 bg-brand-600 rounded-2xl flex items-center justify-center text-white font-extrabold text-2xl mx-auto mb-3 shadow-lg shadow-emerald-200">
                    O
                  </div>
                  <h1 className="text-2xl font-bold text-slate-800">Organize Financeiro</h1>
                  <p className="text-xs text-slate-500 mt-1">Plataforma de Gestão Financeira Pessoal</p>
                </div>

                {authError && (
                  <div className="bg-rose-50 border border-rose-200 text-rose-700 p-3 rounded-xl text-xs font-bold mb-4">
                    {authError}
                  </div>
                )}

                <form onSubmit={handleAuth} className="flex flex-col gap-4">
                  {authMode === 'register' && (
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">Nome Completo</label>
                      <input 
                        type="text" 
                        placeholder="Seu nome"
                        value={authName}
                        onChange={(e) => setAuthName(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-semibold focus:outline-none focus:border-brand-600"
                        required
                      />
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">E-mail</label>
                    <input 
                      type="email" 
                      placeholder="seu@email.com"
                      value={authEmail}
                      onChange={(e) => setAuthEmail(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-semibold focus:outline-none focus:border-brand-600"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Senha</label>
                    <input 
                      type="password" 
                      placeholder="••••••••"
                      value={authPassword}
                      onChange={(e) => setAuthPassword(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-semibold focus:outline-none focus:border-brand-600"
                      required
                    />
                  </div>

                  <button 
                    type="submit" 
                    disabled={authLoading}
                    className="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl text-xs shadow-lg shadow-emerald-200 transition mt-2"
                  >
                    {authLoading ? 'Processando...' : (authMode === 'login' ? 'Entrar no Sistema' : 'Criar Minha Conta')}
                  </button>
                </form>

                <div className="mt-6 text-center">
                  <button 
                    onClick={() => { setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(''); }}
                    className="text-xs font-bold text-brand-600 hover:underline"
                  >
                    {authMode === 'login' ? 'Não tem uma conta? Cadastre-se' : 'Já possui conta? Faça Login'}
                  </button>
                </div>
              </div>
            </div>
          );
        }

        const menuItems = [
          { id: 'dashboard', label: '1. Início / Dashboard', icon: '📊' },
          { id: 'transactions', label: '2. Lançamentos', icon: '📋' },
          { id: 'charts', label: '3. Gráficos e Análises', icon: '📈' },
          { id: 'categories', label: '4. Categorias', icon: '🏷️' },
          { id: 'accounts', label: '5. Contas Bancárias', icon: '🏦' },
          { id: 'cards', label: '6. Cartões de Crédito', icon: '💳' },
          { id: 'installments', label: '7. Parcelas', icon: '🗓️' },
          { id: 'fixed', label: '8. Contas Fixas', icon: '🔄' },
          { id: 'calendar', label: '9. Calendário Financeiro', icon: '📅' },
          { id: 'forecast', label: '10. Previsão Financeira', icon: '🔮' },
          { id: 'debts', label: '11. Empréstimos e Dívidas', icon: '🤝' },
          { id: 'investments', label: '12. Investimentos', icon: '💼' },
          { id: 'goals', label: '13. Metas Financeiras', icon: '🎯' },
          { id: 'emergency', label: '14. Reserva de Emergência', icon: '🛡️' },
          { id: 'budget', label: '15. Orçamento Mensal', icon: '📊' },
          { id: 'ai', label: '16. Assistente IA', icon: '🤖' },
          { id: 'reports', label: '17. Relatórios', icon: '📑' },
          { id: 'export', label: '18. Exportar Dados (Excel)', icon: '📥' },
          { id: 'settings', label: '19. Configurações', icon: '⚙️' },
          { id: 'profile', label: '20. Meu Perfil', icon: '👤' },
        ];

        return (
          <div className="flex min-h-screen bg-slate-100">
            <!-- MENU LATERAL DESKTOP -->
            <aside className={`fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-white flex flex-col transition-transform duration-200 lg:static lg:translate-x-0 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
              <div className="p-5 border-b border-slate-800 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 bg-brand-600 rounded-xl flex items-center justify-center font-bold text-white">O</div>
                  <span className="font-bold text-lg tracking-tight">organize</span>
                </div>
                <button onClick={() => setSidebarOpen(false)} className="lg:hidden text-slate-400 font-bold">✕</button>
              </div>

              <div className="p-4 border-b border-slate-800 bg-slate-800/50">
                <p className="text-xs text-slate-400 font-medium">Utilizador Autenticado</p>
                <p className="text-xs font-bold text-white truncate">{user?.name || user?.email}</p>
              </div>

              <nav className="flex-1 overflow-y-auto p-3 space-y-1 hide-scrollbar">
                {menuItems.map(item => (
                  <button
                    key={item.id}
                    onClick={() => { setActiveSection(item.id); setSidebarOpen(false); }}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold transition ${activeSection === item.id ? 'bg-brand-600 text-white shadow-md shadow-emerald-900/40' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
                  >
                    <span>{item.icon}</span>
                    <span className="truncate">{item.label}</span>
                  </button>
                ))}
              </nav>

              <div className="p-4 border-t border-slate-800">
                <button onClick={handleLogout} className="w-full bg-rose-600/10 text-rose-400 hover:bg-rose-600 hover:text-white py-2 rounded-xl text-xs font-bold transition">
                  Sair da Conta
                </button>
              </div>
            </aside>

            <!-- CONTEÚDO PRINCIPAL -->
            <div className="flex-1 flex flex-col min-w-0">
              <!-- HEADER SUPERIOR -->
              <header className="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-30">
                <div className="flex items-center gap-3">
                  <button onClick={() => setSidebarOpen(true)} className="lg:hidden text-slate-600 font-bold text-xl">☰</button>
                  <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">
                    {menuItems.find(m => m.id === activeSection)?.label}
                  </h2>
                </div>

                <button 
                  onClick={() => setShowModal(true)}
                  className="bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-md shadow-emerald-100 transition"
                >
                  + Novo Lançamento
                </button>
              </header>

              <!-- ÁREA DE DADOS -->
              <main className="p-6 max-w-7xl w-full mx-auto">
                {activeSection === 'dashboard' && (
                  <div className="flex flex-col gap-6">
                    <!-- CARDS DE RESUMO -->
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Receitas do Mês</span>
                        <span className="text-2xl font-extrabold text-emerald-600">{formatMoney(data.summary.totalReceitas)}</span>
                      </div>
                      <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Despesas do Mês</span>
                        <span className="text-2xl font-extrabold text-rose-600">{formatMoney(data.summary.totalDespesas)}</span>
                      </div>
                      <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Saldo Atual</span>
                        <span className={`text-2xl font-extrabold ${data.summary.saldoFinal >= 0 ? 'text-slate-900' : 'text-rose-600'}`}>
                          {formatMoney(data.summary.saldoFinal)}
                        </span>
                      </div>
                    </div>

                    <!-- HISTÓRICO RECENTE -->
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                      <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                        <h3 className="font-bold text-slate-800 text-sm">Últimas Movimentações</h3>
                        <span className="text-xs text-slate-400">{data.transactions.length} lançamentos</span>
                      </div>

                      {data.transactions.length === 0 ? (
                        <p className="text-xs text-slate-400 py-8 text-center">Nenhuma movimentação registrada.</p>
                      ) : (
                        <div className="divide-y divide-slate-100">
                          {data.transactions.map(t => (
                            <div key={t.id} className="py-3 flex items-center justify-between">
                              <div className="flex items-center gap-3">
                                <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs ${t.type === 'income' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                                  {t.type === 'income' ? '+' : '-'}
                                </div>
                                <div>
                                  <p className="text-xs font-bold text-slate-800">{t.description}</p>
                                  <p className="text-[10px] text-slate-400">{t.person} • {t.account}</p>
                                </div>
                              </div>
                              <div className="flex items-center gap-4">
                                <span className={`text-xs font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-700'}`}>
                                  {t.type === 'income' ? '+' : '-'} {formatMoney(t.amount)}
                                </span>
                                <button onClick={() => handleDeleteTransaction(t.id)} className="text-[11px] text-rose-500 font-bold hover:underline">Apagar</button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {activeSection !== 'dashboard' && (
                  <div className="bg-white p-8 rounded-2xl border border-slate-200 text-center py-16">
                    <span className="text-4xl block mb-3">🛠️</span>
                    <h3 className="font-bold text-slate-800 text-base mb-1">Módulo em Integração</h3>
                    <p className="text-xs text-slate-500 max-w-md mx-auto">
                      A seção <strong>{menuItems.find(m => m.id === activeSection)?.label}</strong> está preparada para ser conectada com os novos módulos da Etapa 2.
                    </p>
                  </div>
                )}
              </main>
            </div>

            <!-- MODAL NOVO LANÇAMENTO -->
            {showModal && (
              <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-white w-full max-w-md rounded-2xl p-5 shadow-xl border border-slate-100">
                  <div className="flex items-center justify-between mb-4 border-b border-slate-100 pb-2">
                    <h3 className="font-bold text-slate-800 text-sm">Novo Lançamento</h3>
                    <button onClick={() => setShowModal(false)} className="text-slate-400 text-lg font-bold">✕</button>
                  </div>

                  <form onSubmit={handleAddTransaction} className="flex flex-col gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Descrição</label>
                      <input
                        type="text"
                        placeholder="Ex: Mercado, Luz, Salário"
                        value={description}
                        onChange={(e) => setDescription(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none"
                        required
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-xs font-semibold text-slate-500 mb-1">Valor (R$)</label>
                        <input
                          type="number"
                          step="0.01"
                          placeholder="0,00"
                          value={amount}
                          onChange={(e) => setAmount(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-500 mb-1">Pessoa Responsável</label>
                        <input
                          type="text"
                          value={person}
                          onChange={(e) => setPerson(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Conta / Carteira</label>
                      <select 
                        value={account} 
                        onChange={(e) => setAccount(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none"
                      >
                        <option value="Nubank">Nubank</option>
                        <option value="Inter">Inter</option>
                        <option value="Carteira">Carteira (Dinheiro)</option>
                      </select>
                    </div>

                    <div className="grid grid-cols-2 gap-2 my-1">
                      <button
                        type="button"
                        onClick={() => setType('expense')}
                        className={`py-2 rounded-xl text-xs font-bold transition ${type === 'expense' ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-600'}`}
                      >
                        Despesa (-)
                      </button>
                      <button
                        type="button"
                        onClick={() => setType('income')}
                        className={`py-2 rounded-xl text-xs font-bold transition ${type === 'income' ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-600'}`}
                      >
                        Receita (+)
                      </button>
                    </div>

                    <button
                      type="submit"
                      disabled={submitting}
                      className="bg-brand-600 hover:bg-brand-700 text-white py-2.5 rounded-xl font-bold text-xs shadow-md shadow-emerald-200 transition"
                    >
                      {submitting ? 'Salvando...' : 'Confirmar Lançamento'}
                    </button>
                  </form>
                </div>
              </div>
            )}

          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
