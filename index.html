<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Organize Financeiro</title>
    <!-- Manifest & Tema para virar App (PWA) -->
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#ecfdf5',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
              }
            }
          }
        }
      }
    </script>
    
    <!-- React & React DOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased pb-20 md:pb-8">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function Dashboard() {
        const [data, setData] = useState({ summary: { totalReceitas: 0, totalDespesas: 0, saldoFinal: 0 }, transactions: [] });
        const [description, setDescription] = useState('');
        const [amount, setAmount] = useState('');
        const [type, setType] = useState('expense');
        const [account, setAccount] = useState('Carteira');
        const [loading, setLoading] = useState(false);
        const [showModal, setShowModal] = useState(false);

        const API_URL = 'https://controle-financeiro-x8ah.onrender.com/api/transactions';

        const fetchData = async () => {
          try {
            const res = await fetch(API_URL);
            const json = await res.json();
            setData(json);
          } catch (err) {
            console.error('Erro ao buscar transações:', err);
          }
        };

        useEffect(() => {
          fetchData();
        }, []);

        const handleSubmit = async (e) => {
          e.preventDefault();
          if (!description || !amount) return;

          setLoading(true);
          try {
            await fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                description: account ? `[${account}] ${description}` : description, 
                amount: parseFloat(amount), 
                type 
              })
            });

            setDescription('');
            setAmount('');
            setShowModal(false);
            fetchData();
          } catch (err) {
            console.error(err);
          } finally {
            setLoading(false);
          }
        };

        const formatMoney = (val) => {
          return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
        };

        return (
          <div className="min-h-screen">
            <!-- Header Topo Verde Estilo Organizze -->
            <header className="bg-brand-600 text-white shadow-md">
              <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center font-bold text-white border border-white/30">
                    O
                  </div>
                  <span className="font-bold text-xl tracking-tight">organize</span>
                </div>
                <nav className="hidden md:flex items-center gap-6 text-sm font-medium text-emerald-100">
                  <a href="#" className="text-white border-b-2 border-white pb-1">visão geral</a>
                  <a href="#" className="hover:text-white transition">lançamentos</a>
                  <a href="#" className="hover:text-white transition">relatórios</a>
                  <a href="#" className="hover:text-white transition">contas manuais</a>
                </nav>
                <div className="flex items-center gap-3">
                  <button 
                    onClick={() => setShowModal(true)}
                    className="bg-white text-brand-700 hover:bg-emerald-50 px-3.5 py-1.5 rounded-xl font-bold text-sm shadow-sm transition flex items-center gap-1.5"
                  >
                    <span>+</span> Novo
                  </button>
                </div>
              </div>
            </header>

            <!-- Faixa de Saudação & Resumo Rápido -->
            <div className="bg-white border-b border-slate-200">
              <div className="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <h1 className="text-lg font-bold text-slate-800">Olá, Mãe! 👋</h1>
                  <p className="text-xs text-slate-500">Resumo de movimentações do mês</p>
                </div>

                <div className="flex items-center gap-6 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                  <div>
                    <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Receita Mensal</span>
                    <span className="text-sm font-bold text-emerald-600">{formatMoney(data.summary.totalReceitas)}</span>
                  </div>
                  <div className="h-8 w-px bg-slate-200"></div>
                  <div>
                    <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Despesa Mensal</span>
                    <span className="text-sm font-bold text-rose-600">{formatMoney(data.summary.totalDespesas)}</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Conteúdo Principal - Grid 2 Colunas no Desktop -->
            <main className="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-12 gap-6">
              
              <!-- Coluna Esquerda: Saldo Geral + Minhas Contas -->
              <div className="md:col-span-7 flex flex-col gap-6">
                <!-- Card Saldo Geral -->
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-md uppercase tracking-wider">
                      Saldo Geral
                    </span>
                  </div>
                  <div className="text-3xl font-extrabold text-slate-900 tracking-tight">
                    {formatMoney(data.summary.saldoFinal)}
                  </div>
                </div>

                <!-- Lista de Contas Manuais -->
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <div className="flex items-center justify-between mb-4">
                    <h2 className="font-bold text-slate-800 text-sm">Minhas Contas (Manuais)</h2>
                    <span className="text-xs text-emerald-600 font-semibold cursor-pointer">+ Adicionar</span>
                  </div>

                  <div className="flex flex-col gap-3">
                    <div className="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100">
                      <div className="flex items-center gap-3">
                        <div className="w-8 h-8 rounded-full bg-purple-600 text-white flex items-center justify-center font-bold text-xs">
                          Nu
                        </div>
                        <div>
                          <p className="text-xs font-bold text-slate-800">Nubank</p>
                          <p className="text-[10px] text-slate-400">Conta Manual</p>
                        </div>
                      </div>
                      <span className="text-xs font-bold text-slate-700">{formatMoney(data.summary.saldoFinal)}</span>
                    </div>

                    <div className="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100 opacity-60">
                      <div className="flex items-center gap-3">
                        <div className="w-8 h-8 rounded-full bg-orange-500 text-white flex items-center justify-center font-bold text-xs">
                          In
                        </div>
                        <div>
                          <p className="text-xs font-bold text-slate-800">Banco Inter</p>
                          <p className="text-[10px] text-slate-400">Conta Manual</p>
                        </div>
                      </div>
                      <span className="text-xs font-bold text-slate-700">R$ 0,00</span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Coluna Direita: Histórico de Lançamentos -->
              <div className="md:col-span-5 flex flex-col gap-6">
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <div className="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
                    <h2 className="font-bold text-slate-800 text-sm">Últimos Lançamentos</h2>
                    <span className="text-xs text-slate-400">{data.transactions.length} itens</span>
                  </div>

                  {data.transactions.length === 0 ? (
                    <div className="py-8 text-center text-slate-400 text-xs">
                      Nenhuma movimentação registrada.
                    </div>
                  ) : (
                    <div className="divide-y divide-slate-100 max-h-[400px] overflow-y-auto hide-scrollbar">
                      {data.transactions.map((t) => (
                        <div key={t.id} className="py-3 flex items-center justify-between">
                          <div className="flex items-center gap-2.5">
                            <div className={`w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold ${
                              t.type === 'income' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'
                            }`}>
                              {t.type === 'income' ? '↓' : '↑'}
                            </div>
                            <div>
                              <p className="text-xs font-bold text-slate-800">{t.description}</p>
                              <p className="text-[10px] text-slate-400">
                                {new Date(t.date || t.id).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}
                              </p>
                            </div>
                          </div>
                          <span className={`text-xs font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-700'}`}>
                            {t.type === 'income' ? '+' : '-'} {formatMoney(t.amount)}
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>

            </main>

            <!-- Bottom Navigation Bar (Visual NATIVO DE APP no Celular) -->
            <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 flex justify-between items-center z-40">
              <button className="flex flex-col items-center gap-0.5 text-brand-600">
                <span className="text-lg">🏠</span>
                <span className="text-[10px] font-bold">Início</span>
              </button>
              <button className="flex flex-col items-center gap-0.5 text-slate-400">
                <span className="text-lg">📊</span>
                <span className="text-[10px] font-medium">Relatórios</span>
              </button>
              <button 
                onClick={() => setShowModal(true)}
                className="w-12 h-12 rounded-full bg-brand-600 text-white flex items-center justify-center font-bold text-2xl -mt-5 shadow-lg shadow-emerald-200"
              >
                +
              </button>
              <button className="flex flex-col items-center gap-0.5 text-slate-400">
                <span className="text-lg">💳</span>
                <span className="text-[10px] font-medium">Contas</span>
              </button>
              <button className="flex flex-col items-center gap-0.5 text-slate-400">
                <span className="text-lg">⚙️</span>
                <span className="text-[10px] font-medium">Ajustes</span>
              </button>
            </div>

            <!-- Modal de Novo Lançamento -->
            {showModal && (
              <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-white w-full max-w-md rounded-2xl p-5 shadow-xl border border-slate-100 animate-in fade-in zoom-in duration-200">
                  <div className="flex items-center justify-between mb-4 border-b border-slate-100 pb-2">
                    <h3 className="font-bold text-slate-800 text-sm">Novo Lançamento</h3>
                    <button onClick={() => setShowModal(false)} className="text-slate-400 text-lg font-bold">✕</button>
                  </div>

                  <form onSubmit={handleSubmit} className="flex flex-col gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Descrição</label>
                      <input
                        type="text"
                        placeholder="Ex: Mercado, Luz, Salário"
                        value={description}
                        onChange={(e) => setDescription(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none focus:border-brand-500"
                        required
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-xs font-semibold text-slate-500 mb-1">Valor (R$)</label>
                        <input
                          type="number"
                          step="0.01"
                          placeholder="0,00"
                          value={amount}
                          onChange={(e) => setAmount(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none focus:border-brand-500"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-500 mb-1">Conta / Carteira</label>
                        <select 
                          value={account} 
                          onChange={(e) => setAccount(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none focus:border-brand-500"
                        >
                          <option value="Nubank">Nubank</option>
                          <option value="Inter">Inter</option>
                          <option value="Carteira">Carteira (Dinheiro)</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2 my-1">
                      <button
                        type="button"
                        onClick={() => setType('expense')}
                        className={`py-2 rounded-xl text-xs font-bold transition ${
                          type === 'expense' ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-600'
                        }`}
                      >
                        Despesa (-)
                      </button>
                      <button
                        type="button"
                        onClick={() => setType('income')}
                        className={`py-2 rounded-xl text-xs font-bold transition ${
                          type === 'income' ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-600'
                        }`}
                      >
                        Receita (+)
                      </button>
                    </div>

                    <button
                      type="submit"
                      disabled={loading}
                      className="bg-brand-600 hover:bg-brand-700 text-white py-2.5 rounded-xl font-bold text-xs shadow-md shadow-emerald-200 transition"
                    >
                      {loading ? 'Salvando...' : 'Confirmar Lançamento'}
                    </button>
                  </form>
                </div>
              </div>
            )}

          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<Dashboard />);
    </script>
  </body>
</html>
