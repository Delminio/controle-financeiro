<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle Financeiro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons (Ícones modernos) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & React DOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-12">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function Dashboard() {
        const [data, setData] = useState({ summary: { totalReceitas: 0, totalDespesas: 0, saldoFinal: 0 }, transactions: [] });
        const [description, setDescription] = useState('');
        const [amount, setAmount] = useState('');
        const [type, setType] = useState('expense');
        const [loading, setLoading] = useState(false);

        const API_URL = 'https://controle-financeiro-x8ah.onrender.com/api/transactions';

        const fetchData = async () => {
          try {
            const res = await fetch(API_URL);
            const json = await res.json();
            setData(json);
          } catch (err) {
            console.error('Erro ao carregar dados:', err);
          }
        };

        useEffect(() => {
          fetchData();
        }, []);

        const handleSubmit = async (e) => {
          e.preventDefault();
          if (!description || !amount) return;

          setLoading(true);
          try {
            await fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ description, amount: parseFloat(amount), type })
            });

            setDescription('');
            setAmount('');
            fetchData();
          } catch (err) {
            console.error('Erro ao guardar:', err);
          } finally {
            setLoading(false);
          }
        };

        const formatMoney = (val) => {
          return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
        };

        return (
          <div className="max-w-xl mx-auto px-4 pt-8">
            <!-- Cabeçalho -->
            <header className="mb-8 text-center">
              <div className="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-200 mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
              </div>
              <h1 className="text-2xl font-bold tracking-tight text-slate-900">Controlo Financeiro</h1>
              <p className="text-sm text-slate-500 mt-1">Gestão simples de entradas e saídas</p>
            </header>

            <!-- Cards de Resumo -->
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
              <!-- Entradas -->
              <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between">
                <div className="flex items-center justify-between text-emerald-600 mb-2">
                  <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">Entradas</span>
                  <div className="p-1.5 bg-emerald-50 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
                  </div>
                </div>
                <span className="text-lg font-bold text-slate-900">{formatMoney(data.summary.totalReceitas)}</span>
              </div>

              <!-- Saídas -->
              <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between">
                <div className="flex items-center justify-between text-rose-600 mb-2">
                  <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">Saídas</span>
                  <div className="p-1.5 bg-rose-50 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
                  </div>
                </div>
                <span className="text-lg font-bold text-slate-900">{formatMoney(data.summary.totalDespesas)}</span>
              </div>

              <!-- Saldo -->
              <div className={`p-4 rounded-2xl border shadow-sm flex flex-col justify-between ${data.summary.saldoFinal >= 0 ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-rose-600 border-rose-600 text-white'}`}>
                <div className="flex items-center justify-between opacity-80 mb-2">
                  <span className="text-xs font-semibold uppercase tracking-wider">Saldo Atual</span>
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v12"/><path d="M16 10H8"/></svg>
                </div>
                <span className="text-lg font-bold">{formatMoney(data.summary.saldoFinal)}</span>
              </div>
            </div>

            <!-- Formulário de Novo Lançamento -->
            <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm mb-6">
              <h2 className="text-sm font-semibold text-slate-700 mb-4 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-indigo-600"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                Novo Lançamento
              </h2>

              <form onSubmit={handleSubmit} className="flex flex-col gap-3">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-medium text-slate-500 mb-1">Descrição</label>
                    <input
                      type="text"
                      placeholder="Ex: Mercado, Luz, Salário"
                      value={description}
                      onChange={(e) => setDescription(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-500 mb-1">Valor (R$)</label>
                    <input
                      type="number"
                      step="0.01"
                      placeholder="0,00"
                      value={amount}
                      onChange={(e) => setAmount(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition"
                      required
                    />
                  </div>
                </div>

                <!-- Seletor de Tipo -->
                <div className="grid grid-cols-2 gap-2 mt-1">
                  <button
                    type="button"
                    onClick={() => setType('expense')}
                    className={`py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 border transition ${
                      type === 'expense'
                        ? 'bg-rose-50 border-rose-200 text-rose-700 shadow-sm'
                        : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'
                    }`}
                  >
                    <span className={`w-2 h-2 rounded-full ${type === 'expense' ? 'bg-rose-500' : 'bg-slate-400'}`}></span>
                    Despesa (-)
                  </button>
                  <button
                    type="button"
                    onClick={() => setType('income')}
                    className={`py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 border transition ${
                      type === 'income'
                        ? 'bg-emerald-50 border-emerald-200 text-emerald-700 shadow-sm'
                        : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'
                    }`}
                  >
                    <span className={`w-2 h-2 rounded-full ${type === 'income' ? 'bg-emerald-500' : 'bg-slate-400'}`}></span>
                    Receita (+)
                  </button>
                </div>

                <button
                  type="submit"
                  disabled={loading}
                  className="mt-2 w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white py-2.5 rounded-xl font-semibold text-sm shadow-md shadow-indigo-100 transition flex items-center justify-center gap-2 disabled:opacity-50"
                >
                  {loading ? 'A guardar...' : 'Confirmar Lançamento'}
                </button>
              </form>
            </div>

            <!-- Lista de Histórico -->
            <div className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
              <div className="p-4 border-b border-slate-100 flex items-center justify-between">
                <h2 className="text-sm font-semibold text-slate-700">Histórico de Movimentações</h2>
                <span className="text-xs text-slate-400 font-medium">{data.transactions.length} registos</span>
              </div>

              {data.transactions.length === 0 ? (
                <div className="p-8 text-center text-slate-400 text-sm">
                  Nenhum lançamento registado ainda.
                </div>
              ) : (
                <div className="divide-y divide-slate-100">
                  {data.transactions.map((t) => (
                    <div key={t.id} className="p-4 flex items-center justify-between hover:bg-slate-50/50 transition">
                      <div className="flex items-center gap-3">
                        <div className={`w-9 h-9 rounded-xl flex items-center justify-center font-bold text-sm ${
                          t.type === 'income' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'
                        }`}>
                          {t.type === 'income' ? '+' : '-'}
                        </div>
                        <div>
                          <p className="text-sm font-semibold text-slate-800">{t.description}</p>
                          <p className="text-[11px] text-slate-400">
                            {new Date(t.date || t.id).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' })}
                          </p>
                        </div>
                      </div>
                      <span className={`text-sm font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-700'}`}>
                        {t.type === 'income' ? '+' : '-'} {formatMoney(t.amount)}
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<Dashboard />);
    </script>
  </body>
</html>
