<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Organize Financeiro</title>
    <meta name="theme-color" content="#059669" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#ecfdf5',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
              }
            }
          }
        }
      }
    </script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased pb-20 md:pb-8">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function Dashboard() {
        const [data, setData] = useState({ summary: { totalReceitas: 0, totalDespesas: 0, saldoFinal: 0 }, transactions: [] });
        const [activeTab, setActiveTab] = useState('overview'); // 'overview', 'transactions', 'reports', 'accounts', 'settings'
        
        // Lista de pessoas com a Bernadete fixa no topo
        const [people, setPeople] = useState(['Bernadete (Mae)', 'Filho', 'Familia']);
        const [selectedPersonFilter, setSelectedPersonFilter] = useState('Todas');
        
        // Modais de Pessoas
        const [showPersonSettingsModal, setShowPersonSettingsModal] = useState(false);
        const [editingPersonIndex, setEditingPersonIndex] = useState(null);
        const [editingPersonName, setEditingPersonName] = useState('');
        const [newPersonInput, setNewPersonInput] = useState('');

        // Form States
        const [description, setDescription] = useState('');
        const [amount, setAmount] = useState('');
        const [type, setType] = useState('expense');
        const [account, setAccount] = useState('Nubank');
        const [person, setPerson] = useState('Bernadete (Mae)');
        
        const [showModal, setShowModal] = useState(false);
        const [accountsList, setAccountsList] = useState([
          { name: 'Nubank', color: 'bg-purple-600', initial: 'Nu' },
          { name: 'Banco Inter', color: 'bg-orange-500', initial: 'In' },
          { name: 'Carteira (Dinheiro)', color: 'bg-emerald-600', initial: 'R$' }
        ]);
        const [newAccountName, setNewAccountName] = useState('');
        const [loading, setLoading] = useState(false);

        const API_URL = 'https://controle-financeiro-x8ah.onrender.com/api/transactions';

        const fetchData = async () => {
          try {
            const res = await fetch(API_URL);
            const json = await res.json();
            setData(json);
          } catch (err) {
            console.error(err);
          }
        };

        useEffect(() => {
          fetchData();
        }, []);

        const handleSubmit = async (e) => {
          e.preventDefault();
          if (!description || !amount) return;

          setLoading(true);
          try {
            await fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                description, 
                amount: parseFloat(amount), 
                type,
                account,
                person
              })
            });

            setDescription('');
            setAmount('');
            setShowModal(false);
            fetchData();
          } catch (err) {
            console.error(err);
          } finally {
            setLoading(false);
          }
        };

        const handleDelete = async (id) => {
          if (!confirm('Deseja apagar este lancamento?')) return;
          try {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchData();
          } catch (err) {
            console.error(err);
          }
        };

        // Funções de Gestão de Pessoas
        const handleAddPerson = (e) => {
          e.preventDefault();
          const name = newPersonInput.trim();
          if (!name) return;
          if (!people.includes(name)) {
            setPeople([...people, name]);
          }
          setNewPersonInput('');
        };

        const handleStartEditPerson = (index) => {
          if (index === 0) return; // Bernadete não pode ser renomeada diretamente por regra de segurança
          setEditingPersonIndex(index);
          setEditingPersonName(people[index]);
        };

        const handleSaveEditPerson = (index) => {
          const name = editingPersonName.trim();
          if (!name) return;
          const updated = [...people];
          updated[index] = name;
          setPeople(updated);
          setEditingPersonIndex(null);
          setEditingPersonName('');
        };

        const handleDeletePerson = (index) => {
          if (index === 0) {
            alert('A Bernadete e a pessoa principal do sistema e nao pode ser excluida!');
            return;
          }
          const personToRemove = people[index];
          if (confirm(`Deseja remover ${personToRemove} da lista?`)) {
            const updated = people.filter((_, i) => i !== index);
            setPeople(updated);
            if (selectedPersonFilter === personToRemove) {
              setSelectedPersonFilter('Todas');
            }
          }
        };

        const handleAddAccount = (e) => {
          e.preventDefault();
          if (!newAccountName.trim()) return;
          const initial = newAccountName.substring(0, 2).toUpperCase();
          setAccountsList([...accountsList, { name: newAccountName, color: 'bg-blue-600', initial }]);
          setNewAccountName('');
        };

        const filteredTransactions = selectedPersonFilter === 'Todas'
          ? data.transactions
          : data.transactions.filter(t => (t.person || 'Bernadete (Mae)') === selectedPersonFilter);

        const totalReceitas = filteredTransactions
          .filter(t => t.type === 'income')
          .reduce((acc, t) => acc + Number(t.amount), 0);

        const totalDespesas = filteredTransactions
          .filter(t => t.type === 'expense')
          .reduce((acc, t) => acc + Number(t.amount), 0);

        const saldoFinal = totalReceitas - totalDespesas;

        const formatMoney = (val) => {
          return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
        };

        return (
          <div className="min-h-screen">
            <header className="bg-brand-600 text-white shadow-md">
              <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center font-bold text-white border border-white/30">
                    O
                  </div>
                  <span className="font-bold text-xl tracking-tight">organize</span>
                </div>

                <nav className="hidden md:flex items-center gap-6 text-sm font-medium text-emerald-100">
                  <button 
                    onClick={() => setActiveTab('overview')} 
                    className={`pb-1 transition ${activeTab === 'overview' ? 'text-white border-b-2 border-white font-bold' : 'hover:text-white'}`}
                  >
                    visao geral
                  </button>
                  <button 
                    onClick={() => setActiveTab('transactions')} 
                    className={`pb-1 transition ${activeTab === 'transactions' ? 'text-white border-b-2 border-white font-bold' : 'hover:text-white'}`}
                  >
                    lancamentos
                  </button>
                  <button 
                    onClick={() => setActiveTab('reports')} 
                    className={`pb-1 transition ${activeTab === 'reports' ? 'text-white border-b-2 border-white font-bold' : 'hover:text-white'}`}
                  >
                    relatorios
                  </button>
                  <button 
                    onClick={() => setActiveTab('accounts')} 
                    className={`pb-1 transition ${activeTab === 'accounts' ? 'text-white border-b-2 border-white font-bold' : 'hover:text-white'}`}
                  >
                    contas manuais
                  </button>
                  <button 
                    onClick={() => setActiveTab('settings')} 
                    className={`pb-1 transition ${activeTab === 'settings' ? 'text-white border-b-2 border-white font-bold' : 'hover:text-white'}`}
                  >
                    configuracoes
                  </button>
                </nav>

                <div className="flex items-center gap-2">
                  <button 
                    onClick={() => setShowModal(true)}
                    className="bg-white text-brand-700 hover:bg-emerald-50 px-3.5 py-1.5 rounded-xl font-bold text-sm shadow-sm transition flex items-center gap-1.5"
                  >
                    <span>+</span> Novo
                  </button>
                </div>
              </div>
            </header>

            <div className="bg-white border-b border-slate-200">
              <div className="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div>
                    <h1 className="text-lg font-bold text-slate-800">Ola, Bernadete! 👋</h1>
                    <p className="text-xs text-slate-500">Controle de receitas e despesas</p>
                  </div>
                  
                  <div className="ml-2 flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                    <span className="text-[11px] font-bold text-slate-500 pl-2">Pessoa:</span>
                    <select 
                      value={selectedPersonFilter} 
                      onChange={(e) => setSelectedPersonFilter(e.target.value)}
                      className="bg-transparent text-xs font-bold text-brand-700 p-1 focus:outline-none cursor-pointer"
                    >
                      <option value="Todas">Todas</option>
                      {people.map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                    <button 
                      onClick={() => setShowPersonSettingsModal(true)}
                      className="bg-brand-600 text-white px-2 py-0.5 rounded-lg flex items-center justify-center font-bold text-xs"
                      title="Gerenciar Pessoas"
                    >
                      ⚙️ Pessoas
                    </button>
                  </div>
                </div>

                <div className="flex items-center gap-6 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                  <div>
                    <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Receita Mensal</span>
                    <span className="text-sm font-bold text-emerald-600">{formatMoney(totalReceitas)}</span>
                  </div>
                  <div className="h-8 w-px bg-slate-200"></div>
                  <div>
                    <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Despesa Mensal</span>
                    <span className="text-sm font-bold text-rose-600">{formatMoney(totalDespesas)}</span>
                  </div>
                </div>
              </div>
            </div>

            <main className="max-w-6xl mx-auto px-4 py-6">

              {activeTab === 'overview' && (
                <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
                  <div className="md:col-span-7 flex flex-col gap-6">
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                      <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-md uppercase tracking-wider inline-block mb-2">
                        Saldo Geral ({selectedPersonFilter})
                      </span>
                      <div className="text-3xl font-extrabold text-slate-900 tracking-tight">
                        {formatMoney(saldoFinal)}
                      </div>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                      <div className="flex items-center justify-between mb-4">
                        <h2 className="font-bold text-slate-800 text-sm">Minhas Contas (Manuais)</h2>
                        <button onClick={() => setActiveTab('accounts')} className="text-xs text-emerald-600 font-semibold cursor-pointer">+ Gerenciar</button>
                      </div>

                      <div className="flex flex-col gap-3">
                        {accountsList.map(acc => {
                          const accBalance = filteredTransactions
                            .filter(t => (t.account || 'Nubank') === acc.name)
                            .reduce((accVal, t) => t.type === 'income' ? accVal + Number(t.amount) : accVal - Number(t.amount), 0);

                          return (
                            <div key={acc.name} className="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100">
                              <div className="flex items-center gap-3">
                                <div className={`w-8 h-8 rounded-full ${acc.color} text-white flex items-center justify-center font-bold text-xs`}>
                                  {acc.initial}
                                </div>
                                <div>
                                  <p className="text-xs font-bold text-slate-800">{acc.name}</p>
                                  <p className="text-[10px] text-slate-400">Conta Manual</p>
                                </div>
                              </div>
                              <span className="text-xs font-bold text-slate-700">{formatMoney(accBalance)}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>

                  <div className="md:col-span-5 flex flex-col gap-6">
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                      <div className="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
                        <h2 className="font-bold text-slate-800 text-sm">Ultimos Lancamentos</h2>
                        <button onClick={() => setActiveTab('transactions')} className="text-xs text-brand-600 font-bold">Ver todos</button>
                      </div>

                      {filteredTransactions.length === 0 ? (
                        <div className="py-8 text-center text-slate-400 text-xs">Nenhum lancamento.</div>
                      ) : (
                        <div className="divide-y divide-slate-100 max-h-[350px] overflow-y-auto hide-scrollbar">
                          {filteredTransactions.slice(0, 5).map((t) => (
                            <div key={t.id} className="py-3 flex items-center justify-between">
                              <div className="flex items-center gap-2.5">
                                <div className={`w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold ${
                                  t.type === 'income' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'
                                }`}>
                                  {t.type === 'income' ? '↓' : '↑'}
                                </div>
                                <div>
                                  <p className="text-xs font-bold text-slate-800">{t.description}</p>
                                  <p className="text-[10px] text-slate-400">
                                    {t.person || 'Bernadete'} • {t.account || 'Nubank'}
                                  </p>
                                </div>
                              </div>
                              <span className={`text-xs font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-700'}`}>
                                {t.type === 'income' ? '+' : '-'} {formatMoney(t.amount)}
                              </span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'transactions' && (
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                    <h2 className="font-bold text-slate-800 text-base">Todos os Lancamentos ({filteredTransactions.length})</h2>
                    <button onClick={() => setShowModal(true)} className="bg-brand-600 text-white text-xs px-3 py-1.5 rounded-xl font-bold">+ Novo Lancamento</button>
                  </div>

                  {filteredTransactions.length === 0 ? (
                    <div className="py-12 text-center text-slate-400 text-sm">Sem movimentacoes para exibir.</div>
                  ) : (
                    <div className="divide-y divide-slate-100">
                      {filteredTransactions.map((t) => (
                        <div key={t.id} className="py-3 flex items-center justify-between hover:bg-slate-50 px-2 rounded-xl">
                          <div className="flex items-center gap-3">
                            <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs ${
                              t.type === 'income' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'
                            }`}>
                              {t.type === 'income' ? '+' : '-'}
                            </div>
                            <div>
                              <p className="text-sm font-bold text-slate-800">{t.description}</p>
                              <p className="text-xs text-slate-400">
                                Pessoa: <strong className="text-slate-600">{t.person || 'Bernadete'}</strong> | Conta: <strong className="text-slate-600">{t.account || 'Nubank'}</strong> | {new Date(t.date || t.id).toLocaleDateString('pt-BR')}
                              </p>
                            </div>
                          </div>
                          <div className="flex items-center gap-4">
                            <span className={`text-sm font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-700'}`}>
                              {t.type === 'income' ? '+' : '-'} {formatMoney(t.amount)}
                            </span>
                            <button onClick={() => handleDelete(t.id)} className="text-xs text-rose-500 hover:text-rose-700 font-bold">Apagar</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {activeTab === 'reports' && (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <h2 className="font-bold text-slate-800 text-sm mb-4">Resumo por Pessoa</h2>
                    <div className="flex flex-col gap-3">
                      {people.map(p => {
                        const pTotal = data.transactions
                          .filter(t => (t.person || 'Bernadete (Mae)') === p)
                          .reduce((acc, t) => t.type === 'income' ? acc + Number(t.amount) : acc - Number(t.amount), 0);
                        return (
                          <div key={p} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl">
                            <span className="text-xs font-bold text-slate-700">{p}</span>
                            <span className={`text-xs font-bold ${pTotal >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                              {formatMoney(pTotal)}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <h2 className="font-bold text-slate-800 text-sm mb-4">Balanco Geral da Familia</h2>
                    <div className="p-4 bg-emerald-50 border border-emerald-100 rounded-xl mb-3">
                      <p className="text-xs font-bold text-emerald-800">Total Entradas</p>
                      <p className="text-xl font-extrabold text-emerald-600">{formatMoney(data.summary.totalReceitas)}</p>
                    </div>
                    <div className="p-4 bg-rose-50 border border-rose-100 rounded-xl">
                      <p className="text-xs font-bold text-rose-800">Total Saidas</p>
                      <p className="text-xl font-extrabold text-rose-600">{formatMoney(data.summary.totalDespesas)}</p>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'accounts' && (
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <h2 className="font-bold text-slate-800 text-base mb-4">Gerenciar Contas Manuais</h2>
                  
                  <form onSubmit={handleAddAccount} className="flex gap-2 mb-6 max-w-md">
                    <input 
                      type="text" 
                      placeholder="Nome da Conta (ex: Itau, Caixa)"
                      value={newAccountName}
                      onChange={(e) => setNewAccountName(e.target.value)}
                      className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none"
                    />
                    <button type="submit" className="bg-brand-600 text-white text-xs px-4 py-2 rounded-xl font-bold">+ Criar Conta</button>
                  </form>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    {accountsList.map(acc => (
                      <div key={acc.name} className="p-4 rounded-xl border border-slate-200 bg-slate-50 flex items-center gap-3">
                        <div className={`w-10 h-10 rounded-full ${acc.color} text-white flex items-center justify-center font-bold text-sm`}>
                          {acc.initial}
                        </div>
                        <div>
                          <p className="text-xs font-bold text-slate-800">{acc.name}</p>
                          <p className="text-[10px] text-slate-400">Conta Manual Ativa</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <!-- ABA 5: CONFIGURAÇÕES DE PESSOAS -->
              {activeTab === 'settings' && (
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm max-w-2xl mx-auto">
                  <h2 className="font-bold text-slate-800 text-base mb-2">Configuracao de Pessoas</h2>
                  <p className="text-xs text-slate-500 mb-6">Gerencie quem pode ter contas ou despesas lancadas no sistema.</p>

                  <form onSubmit={handleAddPerson} className="flex gap-2 mb-6">
                    <input 
                      type="text" 
                      placeholder="Nome da nova pessoa..."
                      value={newPersonInput}
                      onChange={(e) => setNewPersonInput(e.target.value)}
                      className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none"
                    />
                    <button type="submit" className="bg-brand-600 text-white text-xs px-4 py-2 rounded-xl font-bold">+ Adicionar</button>
                  </form>

                  <div className="divide-y divide-slate-100">
                    {people.map((p, index) => (
                      <div key={p} className="py-3 flex items-center justify-between">
                        {editingPersonIndex === index ? (
                          <div className="flex items-center gap-2 flex-1 mr-4">
                            <input 
                              type="text"
                              value={editingPersonName}
                              onChange={(e) => setEditingPersonName(e.target.value)}
                              className="bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 text-xs font-bold w-full"
                            />
                            <button onClick={() => handleSaveEditPerson(index)} className="bg-emerald-600 text-white text-xs px-3 py-1 rounded-lg font-bold">Salvar</button>
                            <button onClick={() => setEditingPersonIndex(null)} className="text-xs text-slate-400 font-bold">Cancelar</button>
                          </div>
                        ) : (
                          <div className="flex items-center gap-2">
                            <span className="text-sm font-bold text-slate-800">{p}</span>
                            {index === 0 && (
                              <span className="text-[10px] font-extrabold bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">Fixo (Mae)</span>
                            )}
                          </div>
                        )}

                        {editingPersonIndex !== index && (
                          <div className="flex items-center gap-3">
                            {index !== 0 ? (
                              <>
                                <button onClick={() => handleStartEditPerson(index)} className="text-xs text-brand-600 font-bold hover:underline">Editar</button>
                                <button onClick={() => handleDeletePerson(index)} className="text-xs text-rose-500 font-bold hover:underline">Excluir</button>
                              </>
                            ) : (
                              <span className="text-[11px] text-slate-400 italic">Protegido</span>
                            )}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

            </main>

            <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-2 flex justify-between items-center z-40">
              <button onClick={() => setActiveTab('overview')} className={`flex flex-col items-center gap-0.5 ${activeTab === 'overview' ? 'text-brand-600 font-bold' : 'text-slate-400'}`}>
                <span className="text-lg">🏠</span>
                <span className="text-[10px]">Inicio</span>
              </button>
              <button onClick={() => setActiveTab('transactions')} className={`flex flex-col items-center gap-0.5 ${activeTab === 'transactions' ? 'text-brand-600 font-bold' : 'text-slate-400'}`}>
                <span className="text-lg">📋</span>
                <span className="text-[10px]">Lancamentos</span>
              </button>
              <button 
                onClick={() => setShowModal(true)}
                className="w-12 h-12 rounded-full bg-brand-600 text-white flex items-center justify-center font-bold text-2xl -mt-5 shadow-lg shadow-emerald-200"
              >
                +
              </button>
              <button onClick={() => setActiveTab('reports')} className={`flex flex-col items-center gap-0.5 ${activeTab === 'reports' ? 'text-brand-600 font-bold' : 'text-slate-400'}`}>
                <span className="text-lg">📊</span>
                <span className="text-[10px]">Relatorios</span>
              </button>
              <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center gap-0.5 ${activeTab === 'settings' ? 'text-brand-600 font-bold' : 'text-slate-400'}`}>
                <span className="text-lg">⚙️</span>
                <span className="text-[10px]">Ajustes</span>
              </button>
            </div>

            {/* MODAL CONFIGURAÇÃO RÁPIDA DE PESSOAS */}
            {showPersonSettingsModal && (
              <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-white w-full max-w-md rounded-2xl p-5 shadow-xl border border-slate-100">
                  <div className="flex items-center justify-between mb-4 border-b border-slate-100 pb-2">
                    <h3 className="font-bold text-slate-800 text-sm">Gerenciar Pessoas</h3>
                    <button onClick={() => setShowPersonSettingsModal(false)} className="text-slate-400 text-lg font-bold">✕</button>
                  </div>

                  <form onSubmit={handleAddPerson} className="flex gap-2 mb-4">
                    <input
                      type="text"
                      placeholder="Adicionar nova pessoa..."
                      value={newPersonInput}
                      onChange={(e) => setNewPersonInput(e.target.value)}
                      className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none"
                    />
                    <button type="submit" className="bg-brand-600 text-white text-xs px-3 py-2 rounded-xl font-bold">+ Criar</button>
                  </form>

                  <div className="divide-y divide-slate-100 max-h-60 overflow-y-auto">
                    {people.map((p, index) => (
                      <div key={p} className="py-2.5 flex items-center justify-between">
                        {editingPersonIndex === index ? (
                          <div className="flex items-center gap-2 flex-1 mr-2">
                            <input 
                              type="text"
                              value={editingPersonName}
                              onChange={(e) => setEditingPersonName(e.target.value)}
                              className="bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 text-xs font-bold w-full"
                            />
                            <button onClick={() => handleSaveEditPerson(index)} className="bg-emerald-600 text-white text-xs px-2 py-1 rounded-lg font-bold">Ok</button>
                          </div>
                        ) : (
                          <div className="flex items-center gap-2">
                            <span className="text-xs font-bold text-slate-800">{p}</span>
                            {index === 0 && <span className="text-[9px] font-bold bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded">Fixo</span>}
                          </div>
                        )}

                        {editingPersonIndex !== index && (
                          <div className="flex items-center gap-2">
                            {index !== 0 && (
                              <>
                                <button onClick={() => handleStartEditPerson(index)} className="text-[11px] text-brand-600 font-bold">Editar</button>
                                <button onClick={() => handleDeletePerson(index)} className="text-[11px] text-rose-500 font-bold">Excluir</button>
                              </>
                            )}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* MODAL NOVO LANÇAMENTO */}
            {showModal && (
              <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-white w-full max-w-md rounded-2xl p-5 shadow-xl border border-slate-100">
                  <div className="flex items-center justify-between mb-4 border-b border-slate-100 pb-2">
                    <h3 className="font-bold text-slate-800 text-sm">Novo Lancamento</h3>
                    <button onClick={() => setShowModal(false)} className="text-slate-400 text-lg font-bold">✕</button>
                  </div>

                  <form onSubmit={handleSubmit} className="flex flex-col gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Descricao</label>
                      <input
                        type="text"
                        placeholder="Ex: Mercado, Luz, Salario"
                        value={description}
                        onChange={(e) => setDescription(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none"
                        required
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-xs font-semibold text-slate-500 mb-1">Valor (R$)</label>
                        <input
                          type="number"
                          step="0.01"
                          placeholder="0,00"
                          value={amount}
                          onChange={(e) => setAmount(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-500 mb-1">Pessoa Responsavel</label>
                        <select 
                          value={person} 
                          onChange={(e) => setPerson(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none"
                        >
                          {people.map(p => <option key={p} value={p}>{p}</option>)}
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Conta / Carteira</label>
                      <select 
                        value={account} 
                        onChange={(e) => setAccount(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none"
                      >
                        {accountsList.map(a => <option key={a.name} value={a.name}>{a.name}</option>)}
                      </select>
                    </div>

                    <div className="grid grid-cols-2 gap-2 my-1">
                      <button
                        type="button"
                        onClick={() => setType('expense')}
                        className={`py-2 rounded-xl text-xs font-bold transition ${
                          type === 'expense' ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-600'
                        }`}
                      >
                        Despesa (-)
                      </button>
                      <button
                        type="button"
                        onClick={() => setType('income')}
                        className={`py-2 rounded-xl text-xs font-bold transition ${
                          type === 'income' ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-600'
                        }`}
                      >
                        Receita (+)
                      </button>
                    </div>

                    <button
                      type="submit"
                      disabled={loading}
                      className="bg-brand-600 hover:bg-brand-700 text-white py-2.5 rounded-xl font-bold text-xs shadow-md shadow-emerald-200 transition"
                    >
                      {loading ? 'Salvando...' : 'Confirmar Lancamento'}
                    </button>
                  </form>
                </div>
              </div>
            )}

          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<Dashboard />);
    </script>
  </body>
</html>
